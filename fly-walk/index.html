<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>초파리 뇌 걷기 — 2D 시뮬레이션</title>
  <meta name="description" content="2026 수컷 초파리 뇌 배선 지도(MaleCNS)를 물통(LIF) 모델로 구동하여 2D 초파리를 걷게 하는 시뮬레이터입니다.">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"
      }
    }
  </script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Pretendard Variable", -apple-system, BlinkMacSystemFont, system-ui, sans-serif; background: linear-gradient(135deg, #0d0a06 0%, #1a150d 40%, #261e12 100%); color: #f3e5ab; display: flex; flex-direction: column; min-height: 100vh; overflow-x: hidden; }
    header { display: flex; align-items: center; justify-content: space-between; padding: 16px 24px; background: rgba(22, 17, 10, 0.9); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(212, 175, 55, 0.35); box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
    header h1 { font-size: 1.2rem; font-weight: 700; color: #fff8e7; text-shadow: 0 0 10px rgba(212, 175, 55, 0.3); }
    header h1 span { color: #d4af37; font-size: 0.9rem; margin-left: 8px; font-weight: 500; }
    .status-bar { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: #d4c39c; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #645332; }
    .dot.live { background: #ffd700; box-shadow: 0 0 10px #ffd700; }
    
    main { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 16px; max-width: 1400px; margin: 0 auto; width: 100%; }
    @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
    @media (max-width: 768px) {
      header { flex-direction: column; align-items: flex-start; gap: 8px; padding: 12px 16px; }
      header h1 { font-size: 1.05rem; }
      header h1 span { display: block; margin-left: 0; margin-top: 2px; }
      main { padding: 10px; gap: 12px; }
      .card { padding: 12px; }
      .controls { gap: 6px; }
      button { padding: 8px 10px; font-size: 0.8rem; flex: 1 1 auto; min-height: 38px; text-align: center; }
      .antenna-group { flex-wrap: wrap; width: 100%; margin-bottom: 4px; }
    }
    @media (max-width: 480px) {
      .canvas-container { aspect-ratio: 1; max-height: 65vh; }
    }

    .card { background: rgba(28, 22, 14, 0.85); border: 1px solid rgba(212, 175, 55, 0.35); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; position: relative; box-shadow: 0 6px 24px rgba(0, 0, 0, 0.6), inset 0 0 20px rgba(212, 175, 55, 0.04); }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .card-title { font-weight: 600; font-size: 1rem; color: #f3e5ab; text-shadow: 0 0 8px rgba(212, 175, 55, 0.25); }

    .canvas-container { position: relative; width: 100%; aspect-ratio: 1; background: #141009; border-radius: 8px; overflow: hidden; border: 1px solid rgba(212, 175, 55, 0.3); box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.8); }
    canvas#c { width: 100%; height: 100%; display: block; cursor: crosshair; }
    #brain { width: 100%; height: 100%; background: #141009; border-radius: 8px; }

    .controls { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    button { background: rgba(45, 36, 22, 0.9); border: 1px solid rgba(212, 175, 55, 0.4); color: #f3e5ab; padding: 8px 14px; border-radius: 6px; font-size: 0.85rem; cursor: pointer; transition: all 0.2s; }
    button:hover { background: rgba(75, 60, 35, 1); border-color: #ffd700; color: #ffffff; box-shadow: 0 0 12px rgba(212, 175, 55, 0.5); }
    button[aria-pressed="true"] { background: linear-gradient(135deg, #b8860b 0%, #d4af37 50%, #996515 100%); border-color: #ffe57f; color: #0a0804; font-weight: 700; box-shadow: 0 0 12px rgba(212, 175, 55, 0.6); }

    .antenna-group { display: flex; gap: 4px; align-items: center; }
    .antenna-group span { font-size: 0.8rem; color: #d4c39c; margin-right: 4px; }

    #loading { position: fixed; inset: 0; background: rgba(13, 10, 6, 0.95); z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; backdrop-filter: blur(8px); }
    #loading div { font-size: 1.1rem; color: #f3e5ab; font-weight: 600; text-shadow: 0 0 10px rgba(212, 175, 55, 0.4); }
    progress { width: 240px; height: 8px; border-radius: 4px; overflow: hidden; accent-color: #d4af37; }
    #progText { font-size: 0.85rem; color: #c5b388; }
  </style>
</head>
<body>
  <div id="loading">
    <div>초파리 뇌 배선 로딩 중...</div>
    <progress id="prog" value="0" max="100"></progress>
    <small id="progText">준비 중...</small>
  </div>

  <header>
    <h1>초파리 뇌 걷기 시뮬레이터 <span>MaleCNS 2026 Connectome</span></h1>
    <div class="status-bar">
      <div id="dot" class="dot"></div>
      <span id="statusText">초기화 중...</span>
    </div>
  </header>

  <main>
    <div class="card">
      <div class="card-header">
        <div class="card-title">🪰 3D 초파리 물리 무대 (바닥 클릭하여 바나나 배치)</div>
        <div id="count" style="font-weight: bold; color: #ffd700; font-size: 0.95rem;"></div>
      </div>
      <div class="canvas-container">
        <canvas id="c" width="800" height="800"></canvas>
      </div>
      <div class="controls">
        <div class="antenna-group">
          <span>더듬이:</span>
          <button type="button" data-antenna="normal" aria-pressed="true">정상</button>
          <button type="button" data-antenna="noLeft">왼쪽 제거</button>
          <button type="button" data-antenna="noRight">오른쪽 제거</button>
          <button type="button" data-antenna="swap">반전</button>
        </div>
        <button type="button" id="clear">바나나 치우기</button>
        <button type="button" id="reset">초기화</button>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <div class="card-title">🧠 3D 초파리 뇌 신경망 실시간 발화</div>
      </div>
      <div class="canvas-container">
        <div id="brain"></div>
      </div>
      <div class="controls">
        <button type="button" id="cut" aria-pressed="false">시냅스 끄기</button>
        <button type="button" id="rotate" aria-pressed="true">회전 멈춤/시작</button>
      </div>
    </div>
  </main>

  <script type="module" src="./app.js"></script>
</body>
</html>
